[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-mapmaker"
version = "0.2.0"
description = "Build interactive concept maps from Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jack Lichwa", email = "jacklichwa@gmail.com" },
]
dependencies = [
  "PyYAML>=6.0",
  "markdown-pdf>=1.13",
]
keywords = ["concept-map", "markdown", "markmap", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/JLichwa80/concept-mapmaker"
Repository = "https://github.com/JLichwa80/concept-mapmaker"
Issues = "https://github.com/JLichwa80/concept-mapmaker/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
]

[project.scripts]
concept-map = "concept_mapmaker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
concept_mapmaker = ["templates/*.html", "templates/scaffold/*"]
