name: Publish to PyPI

# Publishes to PyPI when you cut a GitHub Release. Uses Trusted Publishing
# (OIDC) — no API tokens or secrets are stored in the repo.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Project name:     concept-mapmaker
#   Owner:            JLichwa80
#   Repository name:  concept-mapmaker
#   Workflow name:    publish.yml
#   Environment name: pypi
# Then create a matching GitHub Environment named "pypi" in repo settings.

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
